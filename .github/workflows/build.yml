name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft 26.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build i testy
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Wyniki testow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

      - name: Gotowy mod (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: MyAllay-s-26.2
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  legacy:
    name: Minecraft ${{ matrix.version }}
    runs-on: ubuntu-latest
    # Wersje legacy-* to osobne kopie moda — ich bledy nie blokuja glownego buildu.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11"]
    defaults:
      run:
        working-directory: legacy-${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Gotowy mod (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: MyAllay-s-${{ matrix.version }}
          path: |
            legacy-${{ matrix.version }}/build/libs/*.jar
            !legacy-${{ matrix.version }}/build/libs/*-sources.jar
